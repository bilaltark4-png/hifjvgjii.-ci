<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#3d1226"/>
      <stop offset="45%" stop-color="#240716"/>
      <stop offset="100%" stop-color="#0d0107"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faebd0"/>
      <stop offset="35%" stop-color="#e5c58a"/>
      <stop offset="70%" stop-color="#c9a26a"/>
      <stop offset="100%" stop-color="#8a6132"/>
    </linearGradient>
    <radialGradient id="auraGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e58aa6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#c9a26a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Velvet Luxury Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>

  <!-- Warm Mystic Aura -->
  <circle cx="256" cy="256" r="180" fill="url(#auraGrad)"/>

  <!-- Ornate Golden Outer Ring -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-dasharray="16 6" opacity="0.75"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.45"/>

  <!-- Central Celestial Melancholy Star ✦ -->
  <g transform="translate(256, 240)" filter="url(#goldGlow)">
    <!-- 8-point Diamond Star -->
    <path d="M 0,-105 Q 12,-35 38,-38 Q 35,-12 105,0 Q 35,12 38,38 Q 12,35 0,105 Q -12,35 -38,38 Q -35,12 -105,0 Q -35,-12 -38,-38 Q -12,-35 0,-105 Z" fill="url(#goldGrad)"/>
    <!-- Diagonal Subtle Rays -->
    <path d="M 0,-70 Q 8,-22 24,-24 Q 22,-8 70,0 Q 22,8 24,24 Q 8,22 0,70 Q -8,22 -24,24 Q -22,8 -70,0 Q -22,-8 -24,-24 Q -8,-22 0,-70 Z" fill="#ffffff" opacity="0.55" transform="rotate(45)"/>
    <!-- Center Sparkling Core -->
    <circle cx="0" cy="0" r="14" fill="#ffffff"/>
    <circle cx="0" cy="0" r="24" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.85"/>
  </g>

  <!-- Title Text Ribbon Symbol: حروف الوجع -->
  <text x="256" y="405" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="34" fill="url(#goldGrad)" letter-spacing="2">حروف الوجع</text>
  <text x="256" y="432" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#e58aa6" opacity="0.85" letter-spacing="4">عبارات حزينة</text>
</svg>
