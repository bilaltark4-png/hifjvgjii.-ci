<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGradMask" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3d1226"/>
      <stop offset="45%" stop-color="#240716"/>
      <stop offset="100%" stop-color="#0d0107"/>
    </radialGradient>
    <linearGradient id="goldGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faebd0"/>
      <stop offset="35%" stop-color="#e5c58a"/>
      <stop offset="70%" stop-color="#c9a26a"/>
      <stop offset="100%" stop-color="#8a6132"/>
    </linearGradient>
    <radialGradient id="auraGradMask" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e58aa6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#c9a26a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full Bleed Square Background for Maskable Icon -->
  <rect width="512" height="512" fill="url(#bgGradMask)"/>

  <!-- Mystic Aura within Safe Zone -->
  <circle cx="256" cy="256" r="140" fill="url(#auraGradMask)"/>

  <!-- Golden Ring (well within 80% safe zone circle r=204) -->
  <circle cx="256" cy="256" r="135" fill="none" stroke="url(#goldGradMask)" stroke-width="3" stroke-dasharray="14 5" opacity="0.75"/>
  <circle cx="256" cy="256" r="125" fill="none" stroke="url(#goldGradMask)" stroke-width="1.8" opacity="0.45"/>

  <!-- Central Celestial Star ✦ (scaled to comfortably fit inside safe zone) -->
  <g transform="translate(256, 240) scale(0.82)">
    <path d="M 0,-105 Q 12,-35 38,-38 Q 35,-12 105,0 Q 35,12 38,38 Q 12,35 0,105 Q -12,35 -38,38 Q -35,12 -105,0 Q -35,-12 -38,-38 Q -12,-35 0,-105 Z" fill="url(#goldGradMask)"/>
    <path d="M 0,-70 Q 8,-22 24,-24 Q 22,-8 70,0 Q 22,8 24,24 Q 8,22 0,70 Q -8,22 -24,24 Q -22,8 -70,0 Q -22,-8 -24,-24 Q -8,-22 0,-70 Z" fill="#ffffff" opacity="0.55" transform="rotate(45)"/>
    <circle cx="0" cy="0" r="14" fill="#ffffff"/>
    <circle cx="0" cy="0" r="24" fill="none" stroke="url(#goldGradMask)" stroke-width="2.5" opacity="0.85"/>
  </g>

  <!-- Title Text within Safe Zone -->
  <text x="256" y="365" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="28" fill="url(#goldGradMask)" letter-spacing="1.5">حروف الوجع</text>
</svg>
